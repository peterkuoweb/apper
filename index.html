<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apper 編輯器 - HTML (PWA)</title>
    <link rel="stylesheet" href="style.css">

    <!-- Libraries -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Top Navigation Bar (Scratch Style) -->
        <div id="top-nav">
            <div class="nav-brand">Apper</div>
            <div class="nav-links">
                <button id="save-project-btn" class="nav-btn">儲存專案 (.apper)</button>
                <input type="file" id="load-project-input" style="display: none;" accept=".apper" />
                <button id="load-project-btn" class="nav-btn">載入專案</button>
                <button id="export-html-btn" class="nav-btn">匯出 PWA (ZIP)</button>
                <button id="export-native-btn" class="nav-btn">匯出 APK/iOS/EXE</button>
            </div>
            <div class="nav-user">
                <!-- User placeholder -->
                <span>Guest</span>
            </div>
        </div>

        <div id="main-content">
            <!-- Left Panel (Blocks Workspace - Scratch Style Left Side) -->
            <div id="left-panel">
                <div class="tabs-bar">
                    <button class="tab active">程式</button>
                    <!-- <button class="tab">造型</button>
                    <button class="tab">音效</button> -->
                </div>
                <div id="workspace-area">
                    <div id="blocklyArea"></div>
                    <div id="blocklyDiv" style="position: absolute"></div>
                </div>
            </div>

            <!-- Right Panel (Stage & Sprites) -->
            <div id="right-panel">
                <!-- Stage Area (Preview) -->
                <div id="stage-area">
                    <div id="stage-header">
                        <select id="preview-size" class="stage-select">
                            <option value="mobile">Mobile (375x667)</option>
                            <option value="tablet">Tablet (768x1024)</option>
                            <option value="desktop">Desktop (100%)</option>
                        </select>
                        <div class="stage-controls">
                            <!-- Green flag placeholder (not functional yet but for UI match) -->
                            <button title="Play" class="stage-btn flag">▶</button>
                            <button title="Stop" class="stage-btn stop">⬛</button>
                        </div>
                    </div>
                    <div id="preview-container-wrapper">
                        <div id="preview-container"></div>
                    </div>
                </div>

                <!-- Object Area (Sprites & Backdrops / Elements & Pages) -->
                <div id="object-area">
                    <!-- Sprites (Elements) Panel -->
                    <div id="sprites-panel">
                        <div class="panel-header">
                            <span>UI 元素 (Elements)</span>
                            <div class="sprite-actions">
                                <select id="new-element-type" class="stage-select">
                                    <option value="div">區塊 (Div)</option>
                                    <option value="button">按鈕 (Button)</option>
                                    <option value="text">文字 (Text)</option>
                                    <option value="input">輸入框 (Input)</option>
                                    <option value="img">圖片 (Image)</option>
                                    <option value="spacer">留空 (Spacer)</option>
                                    <option value="link">超連結 (Link)</option>
                                </select>
                                <button id="add-element-btn" class="add-btn" title="新增元素">+</button>
                            </div>
                        </div>
                        <div id="elements-list" class="items-grid"></div>
                    </div>

                    <!-- Stage Backdrops (Pages) Panel -->
                    <div id="backdrops-panel">
                        <div class="panel-header">
                            <span>頁面 (Pages)</span>
                            <div class="backdrop-actions">
                                <button id="add-page-btn" class="add-btn" title="新增頁面">+</button>
                            </div>
                        </div>
                        <div id="pages-list" class="items-grid items-vertical"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Our Scripts -->
    <script src="js/state.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
