<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apper 編輯器</title>
    <link rel="stylesheet" href="style.css">

    <!-- Libraries -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="left-panel">
            <div class="panel-header" style="padding: 10px; background: #eee; border-bottom: 1px solid #ccc; font-weight: bold;">程式積木 (Blocks)</div>
            <div id="blocklyArea"></div>
            <div id="blocklyDiv" style="position: absolute"></div>
        </div>
        <div id="right-panel">
            <div id="preview-section" class="section">
                <div class="section-header">
                    預覽 (Preview)
                    <div class="header-actions">
                        <select id="preview-size">
                            <option value="mobile">Mobile (375x667)</option>
                            <option value="tablet">Tablet (768x1024)</option>
                            <option value="desktop">Desktop (100%)</option>
                        </select>
                    </div>
                </div>
                <div id="preview-container-wrapper">
                    <div id="preview-container"></div>
                </div>
            </div>

            <div id="pages-section" class="section">
                <div class="section-header">
                    頁面 (Pages)
                    <button id="add-page-btn" class="btn btn-sm">新增頁面</button>
                </div>
                <div id="pages-list" class="horizontal-list"></div>
            </div>

            <div id="elements-section" class="section">
                <div class="section-header">
                    元素 (Elements)
                    <select id="new-element-type">
                        <option value="div">區塊 (Div)</option>
                        <option value="button">按鈕 (Button)</option>
                        <option value="text">文字 (Text)</option>
                        <option value="input">輸入框 (Input)</option>
                        <option value="img">圖片 (Image)</option>
                        <option value="spacer">留空 (Spacer)</option>
                        <option value="link">超連結 (Link)</option>
                    </select>
                    <button id="add-element-btn" class="btn btn-sm">新增</button>
                </div>
                <div id="elements-list"></div>
            </div>

            <div id="export-section" class="section">
                <div class="section-header">專案管理</div>
                <div class="export-actions">
                    <button id="save-project-btn" class="btn">儲存專案 (.apper)</button>
                    <input type="file" id="load-project-input" style="display: none;" accept=".apper" />
                    <button id="load-project-btn" class="btn">載入專案</button>
                    <button id="export-html-btn" class="btn btn-primary">匯出 PWA (ZIP)</button>
                    <button id="export-native-btn" class="btn btn-primary">匯出 APK/iOS/EXE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Our Scripts -->
    <script src="js/state.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
